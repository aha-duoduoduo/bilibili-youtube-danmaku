name: 自动打包并发布多浏览器扩展

on:
    push:
        branches: [main]
        paths:
            - 'package.json' # 只有当 package.json 版本发生变化时才触发
    workflow_dispatch:
        inputs:
            dry_run:
                description: '只检查商店登录，不创建 Release、不提交商店'
                type: boolean
                default: true

permissions:
    contents: write

env:
    DRY_RUN: ${{ inputs.dry_run == true }}

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: 检出代码
              uses: actions/checkout@v5

            - name: 安装 Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: 读取版本号
              id: get_version
              run: |
                  VERSION=$(jq -r '.version' package.json)
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "PREFIX=B2Y-YouTube-Bilibili-Danmaku-v$VERSION" >> $GITHUB_ENV
                  echo "当前版本: $VERSION"

            - name: 检查是否已存在该版本的 Release
              id: check_release
              run: |
                  VERSION=${{ steps.get_version.outputs.version }}
                  if gh release view "v$VERSION" >/dev/null 2>&1; then
                    echo "exists=true" >> $GITHUB_OUTPUT
                    echo "版本 v$VERSION 的 Release 已存在"
                  else
                    echo "exists=false" >> $GITHUB_OUTPUT
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: 构建并打包四个浏览器版本
              if: steps.check_release.outputs.exists == 'false' || env.DRY_RUN == 'true'
              run: |
                  npm ci
                  for target in chrome:chrome-mv3 firefox:firefox-mv2 edge:edge-mv3 safari:safari-mv2; do
                    browser=${target%%:*}
                    dir=${target#*:}
                    npm run build:$browser
                    (cd .output/$dir && zip -qr "../../$PREFIX-$browser.zip" .)
                  done
                  # Firefox 商店审核需要可复现构建的源码包
                  git archive --format=zip -o "$PREFIX-sources.zip" HEAD
                  ls -l "$PREFIX"-*.zip

            - name: 创建 Release
              if: steps.check_release.outputs.exists == 'false' && env.DRY_RUN != 'true'
              run: |
                  VERSION=${{ steps.get_version.outputs.version }}
                  gh release create "v$VERSION" \
                    --title "v$VERSION" \
                    --generate-notes \
                    "$PREFIX-chrome.zip" \
                    "$PREFIX-firefox.zip" \
                    "$PREFIX-edge.zip" \
                    "$PREFIX-safari.zip"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: 提交 Chrome 和 Firefox 商店审核
              if: steps.check_release.outputs.exists == 'false' || env.DRY_RUN == 'true'
              run: npx -y publish-browser-extension@6.2.0
              env:
                  CHROME_API_VERSION: v2
                  CHROME_PUBLISHER_ID: 51c96a63-89ee-45c5-b4ec-ad10ec724e94
                  CHROME_EXTENSION_ID: dmkbhbnbpfijhgpnfahfioedledohfja
                  CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
                  CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
                  CHROME_ZIP: ${{ env.PREFIX }}-chrome.zip
                  # 用数字 ID：发布工具会去掉 GUID 的大括号，AMO 无法识别
                  FIREFOX_EXTENSION_ID: '2937325'
                  FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
                  FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
                  FIREFOX_ZIP: ${{ env.PREFIX }}-firefox.zip
                  FIREFOX_SOURCES_ZIP: ${{ env.PREFIX }}-sources.zip
